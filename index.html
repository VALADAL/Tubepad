<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YTConsole</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#16110e;--cream:#f1e8dc;--mute:#a8998a;--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.4,.64,1);--tw:22vh;--th:22vh;--gap:2vh}
body.video{--tw:37vh;--th:20.8vh}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--cream);font-family:"DM Sans","Segoe UI",system-ui,sans-serif}
.bg{position:fixed;inset:-8%;background-size:cover;background-position:center;filter:blur(3.4vh) saturate(1.3) brightness(.55);opacity:0;transition:opacity .9s}
.bg.on{opacity:1}
#shade{position:fixed;inset:0;background:linear-gradient(90deg,rgba(22,17,14,.88),rgba(22,17,14,.2) 70%),linear-gradient(0deg,#16110e 6%,rgba(22,17,14,0) 40%)}

/* Menú de burbujas (sale por la izquierda) */
#menu{position:fixed;left:3vw;top:50%;transform:translateY(-50%);z-index:5;display:flex;flex-direction:column;gap:1.4vh;pointer-events:none}
.bub{width:fit-content;padding:1.5vh 3vh;border-radius:99px;font-size:2.1vh;font-weight:500;background:rgba(255,255,255,.1);-webkit-backdrop-filter:blur(2.4vh);backdrop-filter:blur(2.4vh);box-shadow:inset 0 0 0 .2vh rgba(255,255,255,.2);opacity:0;transform:translateX(-14vh) scale(.8);transition:opacity .3s,transform .5s var(--spring),background .3s,color .3s}
body.menu .bub{opacity:1;transform:none;transition-delay:calc(var(--i) * 60ms)}
body.menu .bub.f{background:var(--cream);color:var(--bg);transform:translateX(1.6vh) scale(1.06)}

/* Contenido */
#main{position:fixed;left:7vw;right:0;top:9vh;bottom:0;transition:opacity .5s,filter .5s,transform .6s var(--ease)}
body.menu #main,body.sheet #main{opacity:.25;filter:blur(.8vh)}
body.menu #main{transform:translateX(3vh)}
#ht{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:8.4vh;line-height:1;letter-spacing:-.02em}
#hs{margin-top:1.2vh;font-size:2.1vh;color:var(--mute)}
#rows{position:absolute;left:0;right:0;top:20vh;transition:transform .6s var(--ease);transform:translateY(calc(var(--r,0) * -40vh))}
.row{height:40vh;opacity:.35;transition:opacity .5s}
.row.on{opacity:1}
.lbl{font-family:Fraunces,Georgia,serif;font-size:3vh;margin-bottom:2vh}
.track{display:flex;gap:var(--gap);transition:transform .55s var(--ease);transform:translateX(calc(var(--off,0) * (var(--tw) + var(--gap)) * -1))}
.tile{flex:none;width:var(--tw)}
.art{width:var(--tw);height:var(--th);border-radius:.6vh;background:center/cover;transition:transform .5s var(--spring),box-shadow .4s}
.tile.f .art{transform:scale(1.07);box-shadow:0 0 0 .4vh var(--cream),0 3vh 7vh rgba(0,0,0,.6)}
.nm{margin-top:1.4vh;font-size:2vh;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb{font-size:1.7vh;color:var(--mute)}
.tile.f .nm,.tile.f .sb{transform:translateY(1vh)}
.nm,.sb{transition:transform .35s var(--ease)}

/* Selector de modo */
#mode{position:fixed;top:4vh;right:5vw;z-index:4;display:flex;border-radius:99px;overflow:hidden;font-size:1.9vh;font-weight:500;background:rgba(0,0,0,.25);-webkit-backdrop-filter:blur(2vh);backdrop-filter:blur(2vh);box-shadow:inset 0 0 0 .2vh rgba(255,255,255,.3)}
#mode span{padding:1vh 2.4vh;color:var(--mute);transition:background .3s,color .3s}
#mode span.on{background:var(--cream);color:var(--bg)}
#mode{opacity:0;transform:translateY(-3vh);pointer-events:none;transition:opacity .4s,transform .6s var(--spring)}
body.modeshow #mode{opacity:1;transform:none}

/* Controles: abajo a la derecha, sin tapar el contenido */
#hints{position:fixed;right:3vw;bottom:3vh;z-index:6;display:flex;gap:2.2vh;padding:1.1vh 2vh;border-radius:99px;font-size:1.6vh;font-weight:500;background:rgba(14,11,9,.6);-webkit-backdrop-filter:blur(2.4vh);backdrop-filter:blur(2.4vh);box-shadow:inset 0 0 0 .2vh rgba(255,255,255,.18)}
#hints b{display:inline-grid;place-items:center;width:2.6vh;height:2.6vh;margin-right:.7vh;border-radius:50%;background:rgba(255,255,255,.2);font-size:1.4vh;font-weight:500}

/* Settings */
#sheet{position:fixed;z-index:8;left:50%;top:50%;width:min(60vw,90vh);padding:4vh 4.4vh;border-radius:2.4vh;background:rgba(22,17,14,.78);-webkit-backdrop-filter:blur(3vh);backdrop-filter:blur(3vh);box-shadow:inset 0 0 0 .2vh rgba(255,255,255,.2),0 4vh 10vh rgba(0,0,0,.6);opacity:0;visibility:hidden;transform:translate(-50%,-46%) scale(.94);transition:opacity .35s,visibility .35s,transform .6s var(--spring)}
body.sheet #sheet{opacity:1;visibility:visible;transform:translate(-50%,-50%)}
#sheet h2{font-family:Fraunces,Georgia,serif;font-size:4.4vh;font-weight:600;margin-bottom:3vh}
.srow{display:flex;justify-content:space-between;align-items:center;margin-bottom:2.2vh;font-size:2.1vh}
.sbtn{font:500 2vh "DM Sans",sans-serif;color:var(--cream);background:rgba(255,255,255,.1);border:0;border-radius:99px;padding:1.2vh 3vh;cursor:pointer;box-shadow:inset 0 0 0 .2vh rgba(255,255,255,.2);transition:background .25s,color .25s,transform .4s var(--spring)}
.sbtn.f{background:var(--cream);color:var(--bg);transform:scale(1.06)}
.sbtn.danger{color:#F0997B}
.sbtn.danger.f{background:#F0997B;color:var(--bg)}
#player{position:fixed;inset:0;z-index:7;background:#000;display:none}
body.play #player{display:block}
#player iframe{width:100%;height:100%;border:0;pointer-events:none}
.kq{font:500 3.4vh Fraunces,Georgia,serif;margin-bottom:2.4vh;min-height:4.4vh}
.kg{display:grid;grid-template-columns:repeat(8,1fr);gap:1vh}.kbk{padding:1.2vh 0;text-align:center}
#np{position:fixed;left:3vw;bottom:3vh;z-index:6;display:none;align-items:center;gap:2vh;width:38vh;padding:1.2vh 2.4vh 1.2vh 1.2vh;border-radius:2vh;background:rgba(14,11,9,.6);-webkit-backdrop-filter:blur(2.4vh);backdrop-filter:blur(2.4vh);box-shadow:inset 0 0 0 .2vh rgba(255,255,255,.18)}
#np.on{display:flex}
#npc{width:9vh;height:9vh;border-radius:1vh;background:#333 center/cover;flex:none}
#npi{min-width:0;flex:1}#npt,#npa{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#npt{font-size:2vh;font-weight:500}#npa{font-size:1.7vh;color:var(--mute)}
#npb{height:.5vh;border-radius:9px;background:rgba(255,255,255,.2);margin-top:1.2vh}#npb i{display:block;height:100%;width:0;border-radius:9px;background:var(--cream)}
#toast{position:fixed;left:50%;bottom:12vh;z-index:9;transform:translate(-50%,2vh);opacity:0;padding:1.4vh 3vh;border-radius:99px;font-size:1.9vh;font-weight:500;background:var(--cream);color:var(--bg);transition:all .4s var(--ease);pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style>
</head>
<body>

<div class="bg" id="bgA"></div><div class="bg" id="bgB"></div><div id="shade"></div>

<div id="mode"><span data-m="video">YouTube</span><span data-m="music">Música</span></div>
<div id="menu"></div>
<div id="main"><div id="ht"></div><div id="hs">Loading…</div><div id="rows"></div></div>
<div id="hints"><span><b>A</b>Select</span><span><b>B</b>Menu</span><span><b>Y</b>Mode</span><span><b>X</b>Play/Pause</span><span><b>LB</b><b>RB</b>Prev/Next</span></div>
<div id="sheet"></div>
<div id="np"><div id="npc"></div><div id="npi"><div id="npt"></div><div id="npa"></div><div id="npb"><i></i></div></div></div><div id="toast"></div>

<script>
// ---------- Utilidades ----------
const $ = id => document.getElementById(id);
const store = {   // prefijo "yt_" para no chocar con otras apps
  get: k => localStorage.getItem("yt_" + k),
  set: (k, v) => localStorage.setItem("yt_" + k, v)
};
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove("show"), 2600);
}

// ---------- Carátulas de ejemplo (después serán las reales) ----------
const PAL = [["#b5532e","#f1e8dc"],["#7a5c3e","#d9a86c"],["#3d4a52","#9fb4bf"],["#5b2a3c","#e07a8f"],["#2f4a3a","#9ccf9c"],["#4a3a6b","#b9a6ff"],["#8a6a1f","#ffd36b"],["#1f3f5c","#6fb5ff"]];
function art(i) {
  const p = PAL[i % PAL.length], k = i % 3;
  let s = '<rect width="200" height="200" fill="' + p[0] + '"/>';
  if (k == 0) { s += '<circle cx="100" cy="100" r="58" fill="' + p[1] + '" opacity=".85"/>'; }
  else if (k == 1) { s += '<path d="M0 200L200 40V200Z" fill="' + p[1] + '" opacity=".8"/>'; }
  else { s += '<rect x="30" y="30" width="30" height="140" fill="' + p[1] + '"/><rect x="85" y="60" width="30" height="110" fill="' + p[1] + '" opacity=".7"/><rect x="140" y="90" width="30" height="80" fill="' + p[1] + '" opacity=".5"/>'; }
  return "url('data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">' + s + '</svg>') + "')";
}

// ---------- Datos de cada modo ----------
const T = {
  music: { menu: ["Search", "Home", "Liked", "History", "Settings"], start: 1, rows: [["Loading…", ["…", "…", "…", "…", "…"]]] },
  video: { menu: ["Search", "Home", "Subscriptions", "Watch later", "History", "Settings"], start: 1, rows: [["Loading…", ["…", "…", "…", "…", "…"]]] }
};
const NAME = { music: "YouTube Music", video: "YouTube" };

// ---------- Estado ----------
let start = store.get("start") || "music";   // en qué modo inicia la app
let mode = start, sec = T[mode].start;
let zone = "main";   // "main", "menu" o "sheet"
let r = 0, c = 0, mi = 0, si = 0, bgOn = 0, lastBg = "";
let cur = "", paused = false;   // cur: qué sección estamos esperando de YouTube

// ---------- Dibujar la pantalla ----------
const SEARCH_SVG = '<svg viewBox="0 0 24 24" style="height:2.4vh;display:block" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>';
const esc = s => String(s).replace(/[&<>"']/g, ch => "&#" + ch.charCodeAt(0) + ";");
function tile(n, i) {   // n puede ser texto (ejemplo) o {id, t, s, bg} (real)
  const o = typeof n == "string" ? { t: n, s: "", bg: art(i + (mode == "video" ? 3 : 0)) } : n;
  return '<div class="tile"><div class="art" style="background-image:' + esc(o.bg) + '"></div><div class="nm">' + esc(o.t) + '</div><div class="sb">' + esc(o.s) + '</div></div>';
}
function render() {
  const d = T[mode];
  document.body.classList.toggle("video", mode == "video");
  document.querySelectorAll("#mode span").forEach(s => s.classList.toggle("on", s.dataset.m == mode));
  $("ht").textContent = d.menu[sec];
  $("menu").innerHTML = d.menu.map((n, i) => '<div class="bub" style="--i:' + i + '">' + (n == "Search" ? SEARCH_SVG : n) + '</div>').join("");
  $("rows").innerHTML = d.rows.map((row, ri) =>
    '<div class="row"><div class="lbl">' + esc(row[0]) + '</div><div class="track">' +
    row[1].map((n, i) => tile(n, ri * 5 + i)).join("") +
    '</div></div>').join("");
  r = 0; c = 0;
  refresh();
}

// Pone el fondo difuminado con la carátula (cruza entre dos capas para que sea suave)
function setBg(img) {
  if (!img || img == lastBg) { return; }
  lastBg = img;
  const a = $("bgA"), b = $("bgB");
  const next = bgOn ? a : b, old = bgOn ? b : a;
  next.style.backgroundImage = img;
  next.classList.add("on");
  old.classList.remove("on");
  bgOn = 1 - bgOn;
}

// Actualiza qué elemento está enfocado
function refresh() {
  document.querySelectorAll(".row").forEach((row, ri) => {
    row.classList.toggle("on", ri == r);
    row.querySelectorAll(".tile").forEach((t, ti) => t.classList.toggle("f", zone == "main" && ri == r && ti == c));
    if (ri == r) { row.querySelector(".track").style.setProperty("--off", Math.max(0, c - 3)); }
  });
  $("rows").style.setProperty("--r", r);
  document.querySelectorAll(".bub").forEach((b, i) => b.classList.toggle("f", zone == "menu" && i == mi));
  ["s0", "s1", "s2"].forEach((id, i) => { const e = $(id); if (e) { e.classList.toggle("f", zone == "sheet" && i == si); } });
  const f = document.querySelector(".row.on .tile.f .art") || document.querySelector(".row.on .tile .art");
  if (f) { setBg(f.style.backgroundImage); }   // el fondo sigue a lo seleccionado
}

// ---------- Menú, modo y ajustes ----------
function openMenu() { zone = "menu"; mi = sec; document.body.classList.add("menu"); }
function closeMenu() { zone = "main"; document.body.classList.remove("menu"); }
function setMode(m) {
  mode = m; sec = T[m].start;
  closeMenu();
  render();
  load();
  document.body.classList.add("modeshow");   // el selector aparece un momento y se quita solo
  clearTimeout(setMode.timer);
  setMode.timer = setTimeout(() => document.body.classList.remove("modeshow"), 2200);
}
function pick(i) {
  const n = T[mode].menu[i];
  if (n == "Settings") { closeMenu(); openSheet(); return; }
  if (n == "Search") { closeMenu(); openKb(); return; }
  sec = i; closeMenu(); render(); load();
}
function openSheet() {
  zone = "sheet"; si = 0;
  $("sheet").innerHTML =
    '<h2>Settings</h2>' +
    '<div class="srow"><span>Start in</span><button class="sbtn" id="s0">' + NAME[start] + '</button></div>' +
    '<div class="srow"><span>Your account</span><button class="sbtn" id="s1">' + (logged ? "Sign out" : "Sign in") + '</button></div>' +
    '<div class="srow" style="justify-content:flex-end"><button class="sbtn danger" id="s2">Quit app</button></div>';
  ["s0", "s1", "s2"].forEach((id, i) => { $(id).onclick = () => { si = i; sheetOk(); }; });
  document.body.classList.add("sheet");
}
function closeSheet() { zone = "main"; document.body.classList.remove("sheet"); }
function sheetOk() {
  if (si == 0) {
    start = start == "music" ? "video" : "music";
    store.set("start", start);
    $("s0").textContent = NAME[start];
    toast("Starts in " + NAME[start]);
  } else if (si == 1) {
    send(logged ? "logout" : "login");
  } else {
    try { window.chrome.webview.postMessage("quit"); } catch (e) { window.close(); }   // C# cierra la ventana
  }
}

// ---------- Control (teclado y gamepad usan lo mismo) ----------
function press(a) {
  if (a == "mtoggle" || a == "mnext" || a == "mprev") { sendQ("mc|" + a.slice(1)); return; }
  if (zone == "kb") {
    if (a == "left") { ki = Math.max(0, ki - 1); } else if (a == "right") { ki = Math.min(KB.length - 1, ki + 1); }
    else if (a == "up") { ki = Math.max(0, ki - 8); } else if (a == "down") { ki = Math.min(KB.length - 1, ki + 8); }
    else if (a == "ok") { return kbOk(); } else if (a == "back" || a == "menu") { closeSheet(); return; }
    return drawKb();
  }
  if (zone == "sheet") {
    if (a == "up") { si = Math.max(0, si - 1); }
    else if (a == "down") { si = Math.min(2, si + 1); }
    else if (a == "ok") { sheetOk(); }
    else if (a == "back" || a == "menu") { closeSheet(); }
    return refresh();
  }
  if (a == "mode") { return setMode(mode == "music" ? "video" : "music"); }
  if (zone == "menu") {
    if (a == "up") { mi = Math.max(0, mi - 1); }
    else if (a == "down") { mi = Math.min(T[mode].menu.length - 1, mi + 1); }
    else if (a == "ok") { pick(mi); }
    else if (a == "back" || a == "right" || a == "menu") { closeMenu(); }
    return refresh();
  }
  const n = T[mode].rows[r][1].length;
  if (a == "left") { if (c > 0) { c--; } else { openMenu(); } }
  else if (a == "right") { c = Math.min(n - 1, c + 1); }
  else if (a == "up") { r = Math.max(0, r - 1); c = Math.min(c, T[mode].rows[r][1].length - 1); }
  else if (a == "down") { r = Math.min(T[mode].rows.length - 1, r + 1); c = Math.min(c, T[mode].rows[r][1].length - 1); }
  else if (a == "ok") { const it = T[mode].rows[r][1][c]; if (typeof it == "string") { toast("Still loading…"); } else { play(it); } }
  else if (a == "back" || a == "menu") { openMenu(); }
  refresh();
}

const KEYS = { ArrowLeft: "left", ArrowRight: "right", ArrowUp: "up", ArrowDown: "down", Enter: "ok", Escape: "back", Backspace: "back", m: "mode", y: "mode", " ": "mtoggle", n: "mnext", p: "mprev" };
document.addEventListener("keydown", e => {
  if (zone == "kb" && e.key.length == 1) { e.preventDefault(); kq += e.key; return drawKb(); }   // también puedes escribir con el teclado
  if (zone == "kb" && e.key == "Backspace") { e.preventDefault(); kq = kq.slice(0, -1); return drawKb(); }
  if (KEYS[e.key]) { e.preventDefault(); press(KEYS[e.key]); } });

const DIRS = ["left", "right", "up", "down"];
let held = {};
function pad() {
  const g = [...(navigator.getGamepads ? navigator.getGamepads() : [])].find(x => x);
  if (g) {
    const b = i => g.buttons[i] && g.buttons[i].pressed;
    const now = {
      left: b(14) || g.axes[0] < -.6, right: b(15) || g.axes[0] > .6,
      up: b(12) || g.axes[1] < -.6, down: b(13) || g.axes[1] > .6,
      ok: b(0), back: b(1), mode: b(3), mtoggle: b(2), mprev: b(4), mnext: b(5), menu: b(8) || b(9)
    };
    const t = performance.now();
    for (const k in now) {
      if (!now[k]) { held[k] = 0; }
      else if (!held[k]) { press(k); held[k] = t + 300; }                          // primera pulsación
      else if (DIRS.includes(k) && t > held[k]) { press(k); held[k] = t + 150; }   // repetir si mantienes la dirección
    }
  }
  requestAnimationFrame(pad);
}

// ---------- Datos reales y reproductor ----------
// A qué pantalla de YouTube corresponde cada opción del menú
const BROWSE = {
  music: { "Home": "FEmusic_home", "Liked": "FEmusic_liked_videos", "History": "FEmusic_history" },
  video: { "Home": "FEwhat_to_watch", "Subscriptions": "FEsubscriptions", "Watch later": "VLWL", "History": "FEhistory" }
};
let curQ = "", ki = 0, kq = "";
const sendQ = m => { try { window.chrome.webview.postMessage(m); } catch (e) { } };
function load() {
  const name = T[mode].menu[sec], id = (BROWSE[mode] || {})[name];
  if (!id) { return; }
  cur = mode + "|" + id; curQ = "";
  sendQ("browse|" + mode + "|" + id + "|" + (name == "Subscriptions" ? "~" : name));   // "~" = una fila por canal
}
function onData(d) {
  if (d.key != cur) { return; }
  if (d.error || !d.rows.length) { toast(logged ? "Nothing found" : "Sign in from Settings to see your stuff"); return; }
  T[mode].rows = d.rows.map(x => [x[0], x[1].map(i => ({ id: i.id, t: i.t, s: i.s, bg: "url('" + (i.img || "").replace(/['"()\s]/g, "") + "')" }))]);
  render();
  $("hs").textContent = curQ ? "Results for “" + curQ + "”" : NAME[mode];
  if (curQ) { $("ht").textContent = "Search"; }
}
function play(o) {
  if (mode == "music") { sendQ("mplay|" + o.id); toast("Playing " + o.t); } else { sendQ("vplay|" + o.id); }
}
function onMusic(m) {   // la canción suena en segundo plano; aquí solo mostramos la barrita
  if (!m.t) { return; }
  $("np").classList.add("on");
  $("npt").textContent = (m.p ? "▶ " : "❚❚ ") + m.t;
  $("npa").textContent = m.a;
  $("npc").style.backgroundImage = "url('" + (m.img || "").replace(/=w\d+-h\d+/, "=w600-h600").replace(/['"()\s]/g, "") + "')";
  $("npb").firstChild.style.width = (m.dur ? Math.min(100, m.pos / m.dur * 100) : 0) + "%";
}

// Teclado en pantalla
const KB = "abcdefghijklmnopqrstuvwxyz0123456789".split("").concat(["SPACE", "DEL", "GO"]);
function openKb() { zone = "kb"; ki = 0; kq = ""; drawKb(); document.body.classList.add("sheet"); }
function drawKb() {
  $("sheet").innerHTML = '<h2>Search ' + (mode == "music" ? "songs" : "videos") + '</h2><div class="kq">' + (esc(kq) || "&nbsp;") + '</div><div class="kg">' +
    KB.map((k, i) => '<button class="sbtn kbk' + (i == ki ? " f" : "") + '" data-i="' + i + '">' + (k == "SPACE" ? "␣" : k == "DEL" ? "⌫" : k == "GO" ? "Go" : k) + '</button>').join("") + '</div>';
  document.querySelectorAll(".kbk").forEach(b => b.onclick = () => { ki = +b.dataset.i; kbOk(); });
}
function kbOk() {
  const k = KB[ki];
  if (k == "SPACE") { kq += " "; } else if (k == "DEL") { kq = kq.slice(0, -1); }
  else if (k == "GO") { return kbGo(); } else { kq += k; }
  drawKb();
}
function kbGo() {
  const q = kq.trim().replace(/\|/g, "");
  if (!q) { return; }
  closeSheet(); curQ = q; cur = mode + "|" + q;
  $("hs").textContent = "Searching…";
  sendQ("search|" + mode + "|" + q);
}

// ---------- Cuenta (habla con la app de Windows) ----------
let logged = false;   // ¿hay sesión iniciada?
function send(m) {
  try { window.chrome.webview.postMessage(m); }
  catch (e) { toast("This only works inside the app"); }
}
try {
  window.chrome.webview.addEventListener("message", e => {
    if (typeof e.data == "string" && e.data.startsWith("music:")) { return onMusic(JSON.parse(e.data.slice(6))); }
    if (typeof e.data == "string" && e.data.startsWith("data:")) { return onData(JSON.parse(e.data.slice(5))); }
    if (e.data == "login:ok") { if (!logged) { toast("Account connected"); load(); } logged = true; }
    else if (e.data == "login:no") { logged = false; }
    const b = $("s1");
    if (b) { b.textContent = logged ? "Sign out" : "Sign in"; }
  });
} catch (e) { }

render();
load();
pad();
try { window.chrome.webview.postMessage("status"); } catch (e) { }   // pregunta si ya había sesión
</script>
