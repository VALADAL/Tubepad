<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YTConsole</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#16110e;--cream:#f1e8dc;--mute:#a8998a;--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.4,.64,1);--tw:22vh;--th:22vh;--gap:2vh}
body.video{--tw:37vh;--th:20.8vh}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--cream);font-family:Figtree,"Segoe UI",system-ui,sans-serif}
.bg{position:fixed;inset:-8%;background-size:cover;background-position:center;filter:blur(3.4vh) saturate(1.3) brightness(.55);opacity:0;transition:opacity .9s}
.bg.on{opacity:1}
#shade{position:fixed;inset:0;background:linear-gradient(90deg,rgba(22,17,14,.88),rgba(22,17,14,.2) 70%),linear-gradient(0deg,#16110e 6%,rgba(22,17,14,0) 40%)}

/* Menú de burbujas (sale por la izquierda) */
#menu{position:fixed;left:3vw;top:50%;transform:translateY(-50%);z-index:5;display:flex;flex-direction:column;gap:1.4vh;pointer-events:none}
.bub{width:fit-content;padding:1.5vh 3vh;border-radius:99px;font-size:2.1vh;font-weight:500;background:rgba(255,255,255,.1);-webkit-backdrop-filter:blur(2.4vh);backdrop-filter:blur(2.4vh);box-shadow:inset 0 0 0 .2vh rgba(255,255,255,.2);opacity:0;transform:translateX(-14vh) scale(.8);transition:opacity .3s,transform .5s var(--spring),background .3s,color .3s}
body.menu .bub{opacity:1;transform:none}
body.menu.opening .bub{transition-delay:calc(var(--i) * 60ms)}
body.menu .bub.f{background:var(--cream);color:var(--bg);transform:translateX(1.6vh) scale(1.06)}

/* Contenido */
#main{position:fixed;left:7vw;right:0;top:9vh;bottom:0;transition:opacity .5s,filter .5s,transform .6s var(--ease),top .6s var(--ease)}
body.hasnp #ht{max-width:calc(90vw - 41vh)}
body.menu #main,body.sheet #main{opacity:.25;filter:blur(.8vh)}
body.now #main{opacity:.4;filter:blur(.6vh)}
body.menu #main{transform:translateX(3vh)}
#ht{font-weight:800;font-size:9vh;line-height:1.04;letter-spacing:-.025em;text-shadow:0 .4vh 3vh rgba(0,0,0,.6),0 0 .6vh rgba(0,0,0,.35)}
#hs{margin-top:1.4vh;font-size:2.3vh;font-weight:600;color:var(--mute)}
#vp{position:absolute;left:-4vh;right:0;top:15vh;bottom:0;overflow:hidden;-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 3vh);mask-image:linear-gradient(180deg,transparent 0,#000 3vh)}
#rows{position:absolute;left:4vh;right:0;top:5vh;transition:transform .6s var(--ease);transform:translateY(calc(var(--r,0) * -40vh))}
.row{opacity:.3;filter:blur(1.1vh);transform:scale(.95);transform-origin:0 40%;padding-bottom:3vh;transition:opacity .6s var(--ease),filter .6s var(--ease),transform .7s var(--spring)}.row.car{height:40vh}
.row.on{opacity:1;filter:none;transform:none}
.lbl{font-size:2.6vh;font-weight:700;margin-bottom:2vh}
.track{display:flex;gap:var(--gap);transition:transform .55s var(--ease);transform:translateX(calc(var(--off,0) * (var(--tw) + var(--gap)) * -1))}
.tile{flex:none;width:var(--tw)}
.art{background-color:rgba(255,255,255,.07);width:var(--tw);height:var(--th);border-radius:.6vh;background:center/cover;transition:transform .5s var(--spring),box-shadow .4s}
.tile.f .art{transform:scale(1.07);box-shadow:0 0 0 .4vh var(--cream),0 3vh 7vh rgba(0,0,0,.6)}
.nm{margin-top:1.4vh;font-size:2vh;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb{font-size:1.7vh;color:var(--mute)}
.tile.f .nm,.tile.f .sb{transform:translateY(1vh)}
.nm,.sb{transition:transform .35s var(--ease)}

/* Selector de modo */
#mode{position:fixed;top:4vh;left:0;right:0;margin:0 auto;width:fit-content;z-index:4;display:flex;border-radius:99px;overflow:hidden;font-size:1.9vh;font-weight:500;background:rgba(0,0,0,.25);-webkit-backdrop-filter:blur(2vh);backdrop-filter:blur(2vh);box-shadow:inset 0 0 0 .2vh rgba(255,255,255,.3)}
#mode span{padding:1vh 2.4vh;color:var(--mute);transition:background .3s,color .3s}
#mode span.on{background:var(--cream);color:var(--bg)}
#mode{opacity:0;transform:translateY(-3vh);pointer-events:none;transition:opacity .4s,transform .6s var(--spring)}
body.modeshow #mode{opacity:1;transform:none}

/* Controles: abajo a la derecha, sin tapar el contenido */
#hints{position:fixed;right:3vw;bottom:3vh;z-index:10;display:flex;gap:2.2vh;padding:1.1vh 2vh;border-radius:99px;font-size:1.6vh;font-weight:500;background:rgba(14,11,9,.6);-webkit-backdrop-filter:blur(2.4vh);backdrop-filter:blur(2.4vh);box-shadow:inset 0 0 0 .2vh rgba(255,255,255,.18);opacity:0;transform:translateY(2.4vh) scale(.96);pointer-events:none;transition:opacity .35s,transform .55s var(--spring)}
body.hints #hints{opacity:1;transform:none}
#hints b{display:inline-grid;place-items:center;width:2.6vh;height:2.6vh;margin-right:.7vh;border-radius:50%;background:rgba(255,255,255,.2);font-size:1.4vh;font-weight:500}

/* Settings */
#sheet{position:fixed;z-index:8;left:50%;top:50%;width:min(60vw,90vh);padding:4vh 4.4vh;border-radius:2.4vh;background:rgba(22,17,14,.78);-webkit-backdrop-filter:blur(3vh);backdrop-filter:blur(3vh);box-shadow:inset 0 0 0 .2vh rgba(255,255,255,.2),0 4vh 10vh rgba(0,0,0,.6);opacity:0;visibility:hidden;transform:translate(-50%,-46%) scale(.94);transition:opacity .35s,visibility .35s,transform .6s var(--spring)}
body.sheet #sheet{opacity:1;visibility:visible;transform:translate(-50%,-50%)}
#sheet h2{font-family:Figtree,"Segoe UI",sans-serif;font-size:4.4vh;font-weight:600;margin-bottom:3vh}
.srow{display:flex;justify-content:space-between;align-items:center;margin-bottom:2.2vh;font-size:2.1vh}
.sbtn{font:500 2vh Figtree,sans-serif;color:var(--cream);background:rgba(255,255,255,.1);border:0;border-radius:99px;padding:1.2vh 3vh;cursor:pointer;box-shadow:inset 0 0 0 .2vh rgba(255,255,255,.2);transition:background .25s,color .25s,transform .4s var(--spring)}
.sbtn.f{background:var(--cream);color:var(--bg);transform:scale(1.06)}
.sbtn.danger{color:#F0997B}
.sbtn.danger.f{background:#F0997B;color:var(--bg)}
#player{position:fixed;inset:0;z-index:7;background:#000;display:none}
body.play #player{display:block}
#player iframe{width:100%;height:100%;border:0;pointer-events:none}
.kq{font:500 3.4vh Figtree,"Segoe UI",sans-serif;margin-bottom:2.4vh;min-height:4.4vh}
.kg{display:grid;grid-template-columns:repeat(8,1fr);gap:1vh}.kbk{padding:1.2vh 0;text-align:center}
.kbk.go{grid-column:span 2;background:#2f6bff;color:#fff;box-shadow:none}.kbk.go.f{background:#5b8cff;box-shadow:0 0 0 .4vh var(--cream)}
#np{position:fixed;right:3vw;top:3vh;z-index:6;display:none;width:38vh;height:11.4vh;border-radius:2vh;background:rgba(14,11,9,.6);-webkit-backdrop-filter:blur(2.4vh);backdrop-filter:blur(2.4vh);box-shadow:inset 0 0 0 .2vh rgba(255,255,255,.18);transition:width .65s var(--spring),height .65s var(--spring),border-radius .5s,background .4s}
#np.on{display:block}
body.now #np{width:50vh;height:68vh;border-radius:3vh;background:rgba(14,11,9,.74)}
#npc{position:absolute;left:1.2vh;top:1.2vh;width:9vh;height:9vh;border-radius:1vh;background:#333 center/cover;transition:left .65s var(--spring),top .65s var(--spring),width .65s var(--spring),height .65s var(--spring),border-radius .5s,box-shadow .5s}
body.now #npc{left:3vh;top:3vh;width:44vh;height:44vh;border-radius:1.8vh;box-shadow:0 3vh 7vh rgba(0,0,0,.55)}
#npi{position:absolute;left:11.2vh;right:2.4vh;top:2.3vh;min-width:0;transition:left .65s var(--spring),right .65s var(--spring),top .65s var(--spring)}
body.now #npi{left:3.4vh;right:3.4vh;top:50.5vh}
#npt,#npa{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#npt{font-size:2vh;font-weight:500;transition:font-size .5s var(--ease)}#npa{font-size:1.7vh;color:var(--mute);transition:font-size .5s var(--ease)}
body.now #npt{font-size:3.6vh;font-weight:600}body.now #npa{font-size:2.2vh}
#npb{height:.5vh;border-radius:9px;background:rgba(255,255,255,.2);margin-top:1.2vh;transition:height .5s,margin .5s}#npb i{display:block;height:100%;width:0;border-radius:9px;background:var(--cream)}
body.now #npb{height:.8vh;margin-top:2.2vh}
#nptm{height:0;margin-top:0;overflow:hidden;opacity:0;font-size:1.8vh;color:var(--mute);transition:opacity .4s,height .5s,margin .5s}
body.now #nptm{height:2.4vh;margin-top:1vh;opacity:1}
/* Atajos del teclado en pantalla: burbujas a la izquierda (View las esconde/muestra) */
#kbh{position:fixed;left:3vw;top:50%;transform:translateY(-50%);z-index:9;display:flex;flex-direction:column;gap:1.4vh;pointer-events:none}
.kh{display:flex;align-items:center;gap:1.3vh;width:fit-content;padding:1.2vh 2.8vh 1.2vh 1.4vh;border-radius:99px;font-size:2vh;font-weight:500;background:rgba(255,255,255,.1);-webkit-backdrop-filter:blur(2.4vh);backdrop-filter:blur(2.4vh);box-shadow:inset 0 0 0 .2vh rgba(255,255,255,.2);opacity:0;transform:translateX(-14vh) scale(.8);transition:opacity .3s,transform .5s var(--spring)}
.kh b{display:inline-grid;place-items:center;min-width:3vh;height:3vh;padding:0 .7vh;border-radius:99px;background:rgba(255,255,255,.22);font-size:1.5vh;font-weight:600}
body.kbh .kh{opacity:1;transform:none;transition-delay:calc(var(--i) * 60ms)}
.li{display:flex;align-items:center;gap:2vh;height:8.4vh;width:56vw;padding:0 1.6vh;border-radius:1.2vh;transition:background .25s,transform .4s var(--spring)}
.li.f{background:rgba(255,255,255,.14);transform:translateX(1vh);box-shadow:inset 0 0 0 .2vh rgba(255,255,255,.3)}
.lc{width:6.4vh;height:6.4vh;border-radius:.6vh;background:#333 center/cover;flex:none}.lt{min-width:0}.lt .nm,.lt .sb{margin:0;transform:none!important}
#gate{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;gap:3vh;background:radial-gradient(circle at 50% 40%,#3a2a20,var(--bg) 70%);text-align:center}
body.gate #gate{display:flex}
.gt{font-weight:800;font-size:11vh;letter-spacing:-.02em}.gs{font-size:2.4vh;color:var(--mute)}.gh{font-size:1.7vh;color:var(--mute)}
#gate .sbtn{font-size:2.6vh;padding:1.6vh 6vh}
#toast{position:fixed;left:50%;bottom:12vh;z-index:9;transform:translate(-50%,2vh);opacity:0;padding:1.4vh 3vh;border-radius:99px;font-size:1.9vh;font-weight:500;background:var(--cream);color:var(--bg);transition:all .4s var(--ease);pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
/* Creadores: avatares redondos */
.row.chs{--tw:var(--th)}.row.chs .art{border-radius:50%}.row.chs .nm,.row.chs .sb{text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
#splash{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3.4vh;background:radial-gradient(circle at 50% 42%,#2f2019,var(--bg) 72%);opacity:0;visibility:hidden;transition:opacity .7s,visibility .7s}
body.splash #splash{opacity:1;visibility:visible}
#splash svg{height:12vh;filter:drop-shadow(0 1.5vh 4vh rgba(255,0,0,.35));animation:sp 1.8s ease-in-out infinite}
@keyframes sp{50%{transform:scale(1.08)}}
.spt{font-weight:800;font-size:6vh;letter-spacing:-.02em}.spt span{font-weight:600;color:var(--mute)}
.spb{width:26vh;height:.6vh;border-radius:9px;background:rgba(255,255,255,.15);overflow:hidden}
.spb i{display:block;width:40%;height:100%;border-radius:9px;background:var(--cream);animation:sb 1.3s var(--ease) infinite}
@keyframes sb{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
#vload{position:fixed;inset:0;z-index:25;display:none;flex-direction:column;align-items:center;justify-content:center;gap:3vh;background:rgba(14,11,9,.72);-webkit-backdrop-filter:blur(2.4vh);backdrop-filter:blur(2.4vh)}
body.vload #vload{display:flex;animation:vin .4s var(--ease)}
@keyframes vin{from{opacity:0}}
.vt{font-weight:700;font-size:4.2vh}
</style>
</head>
<body class="splash">

<div class="bg" id="bgA"></div><div class="bg" id="bgB"></div><div id="shade"></div>

<div id="mode"><span data-m="video">YouTube</span><span data-m="music">Música</span></div>
<div id="menu"></div>
<div id="main"><div id="ht"></div><div id="hs">Loading…</div><div id="vp"><div id="rows"></div></div></div>
<div id="hints"><span><b>A</b>Select</span><span><b>B</b>Menu</span><span><b>Y</b>Mode</span><span><b>☰</b>Hints</span><span><b>X</b>Play/Pause</span><span><b>LB</b><b>RB</b>Prev/Next</span><span><b>R</b>Seek</span><span><b>⧉</b>Cover</span></div>
<div id="sheet"></div>
<div id="kbh"><div class="kh" style="--i:0"><b>A</b>Type</div><div class="kh" style="--i:1"><b>X</b>Delete</div><div class="kh" style="--i:2"><b>Y</b>Space</div><div class="kh" style="--i:3"><b>☰</b>Go</div><div class="kh" style="--i:4"><b>B</b>Close</div><div class="kh" style="--i:5"><b>⧉</b>Hide</div></div>
<div id="gate"><div class="gt">Sign in</div><div class="gs">Connect your Google account to continue</div><button class="sbtn f" id="gbtn">Sign in</button><div class="gh">Press A · a window opens to sign in (use mouse or keyboard there)</div></div>
<div id="np"><div id="npc"></div><div id="npi"><div id="npt"></div><div id="npa"></div><div id="npb"><i></i></div><div id="nptm"></div></div></div><div id="toast"></div>
<div id="vload"><div class="vt">Loading video…</div><div class="spb"><i></i></div><div class="gh">B to cancel</div></div>
<div id="splash"><svg viewBox="0 0 100 70"><rect width="100" height="70" rx="20" fill="#ff0000"/><path d="M40 20L68 35L40 50Z" fill="#fff"/></svg><div class="spt">YouTube</div><div class="spb"><i></i></div></div></div>

<script>
// ---------- Utilidades ----------
const $ = id => document.getElementById(id);
const store = {   // prefijo "yt_" para no chocar con otras apps
  get: k => localStorage.getItem("yt_" + k),
  set: (k, v) => localStorage.setItem("yt_" + k, v)
};
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove("show"), 2600);
}

// ---------- Carátulas de ejemplo (después serán las reales) ----------
const PAL = [["#b5532e","#f1e8dc"],["#7a5c3e","#d9a86c"],["#3d4a52","#9fb4bf"],["#5b2a3c","#e07a8f"],["#2f4a3a","#9ccf9c"],["#4a3a6b","#b9a6ff"],["#8a6a1f","#ffd36b"],["#1f3f5c","#6fb5ff"]];
function art(i) {
  const p = PAL[i % PAL.length], k = i % 3;
  let s = '<rect width="200" height="200" fill="' + p[0] + '"/>';
  if (k == 0) { s += '<circle cx="100" cy="100" r="58" fill="' + p[1] + '" opacity=".85"/>'; }
  else if (k == 1) { s += '<path d="M0 200L200 40V200Z" fill="' + p[1] + '" opacity=".8"/>'; }
  else { s += '<rect x="30" y="30" width="30" height="140" fill="' + p[1] + '"/><rect x="85" y="60" width="30" height="110" fill="' + p[1] + '" opacity=".7"/><rect x="140" y="90" width="30" height="80" fill="' + p[1] + '" opacity=".5"/>'; }
  return "url('data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">' + s + '</svg>') + "')";
}

// ---------- Datos de cada modo ----------
const T = {
  music: { menu: ["Search", "Home", "New releases", "Charts", "Library", "History", "Settings"], start: 1, rows: [["Loading…", ["…", "…", "…", "…", "…"]]] },
  video: { menu: ["Search", "Home", "Subscriptions", "Playlists", "Liked videos", "Watch later", "History", "Settings"], start: 1, rows: [["Loading…", ["…", "…", "…", "…", "…"]]] }
};
const NAME = { music: "YouTube Music", video: "YouTube" };

// ---------- Estado ----------
let start = store.get("start") || "music";   // en qué modo inicia la app
let mode = start, sec = T[mode].start;
let zone = "main";   // "main", "menu" o "sheet"
let r = 0, c = 0, mi = 0, si = 0, bgOn = 0, lastBg = "";
let cur = "", paused = false;   // cur: qué sección estamos esperando de YouTube

// ---------- Dibujar la pantalla ----------
const isList = row => !!(row[1][0] && row[1][0].k == "l");   // canciones = lista vertical; lo demás = carrusel
const li = o => '<div class="li"><div class="lc" style="background-image:' + esc(o.bg) + '"></div><div class="lt"><div class="nm">' + esc(o.t) + '</div><div class="sb">' + esc(o.s) + '</div></div></div>';
function rowHtml(row, ri) {
  const L = isList(row), CH = !L && !!(row[1][0] && row[1][0].k == "ch");   // CH: fila de creadores
  return '<div class="row ' + (L ? "lst" : "car") + (CH ? " chs" : "") + '"><div class="lbl">' + esc(row[0]) + '</div>' +
    (L ? '<div class="col">' + row[1].map(li).join("") + '</div>' : '<div class="track">' + row[1].map((n, i) => tile(n, ri * 5 + i)).join("") + '</div>') + '</div>';
}
const SEARCH_SVG = '<svg viewBox="0 0 24 24" style="height:2.4vh;display:block" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>';
const esc = s => String(s).replace(/[&<>"']/g, ch => "&#" + ch.charCodeAt(0) + ";");
function tile(n, i) {   // n puede ser texto (ejemplo) o {id, t, s, bg} (real)
  const o = typeof n == "string" ? { t: n == "…" ? "" : n, s: "", bg: "none" } : n;   // texto = esqueleto de carga
  return '<div class="tile"><div class="art" style="background-image:' + esc(o.bg) + '"></div><div class="nm">' + esc(o.t) + '</div><div class="sb">' + esc(o.s) + '</div></div>';
}
function render() {
  const d = T[mode];
  document.body.classList.toggle("video", mode == "video");
  document.querySelectorAll("#mode span").forEach(s => s.classList.toggle("on", s.dataset.m == mode));
  $("ht").textContent = d.menu[sec];
  $("menu").innerHTML = d.menu.map((n, i) => '<div class="bub" style="--i:' + i + '">' + (n == "Search" ? SEARCH_SVG : n) + '</div>').join("");
  $("rows").innerHTML = d.rows.map((row, ri) => rowHtml(row, ri)).join("");
  r = 0; c = 0;
  refresh();
}

// Pone el fondo difuminado con la carátula (cruza entre dos capas para que sea suave)
function setBg(img) {
  if (!img || img == "none" || img == lastBg) { return; }
  lastBg = img;
  const a = $("bgA"), b = $("bgB");
  const next = bgOn ? a : b, old = bgOn ? b : a;
  next.style.backgroundImage = img;
  next.classList.add("on");
  old.classList.remove("on");
  bgOn = 1 - bgOn;
}

// Actualiza qué elemento está enfocado
function refresh() {
  document.querySelectorAll(".row").forEach((row, ri) => {
    row.classList.toggle("on", ri == r);
    row.querySelectorAll(".tile, .li").forEach((t, ti) => t.classList.toggle("f", zone == "main" && ri == r && ti == c));
    const tr = row.querySelector(".track"); if (ri == r && tr) { tr.style.setProperty("--off", Math.max(0, c - (row.classList.contains("chs") ? 5 : 3))); }
  });
  const rowEl = document.querySelectorAll(".row")[r];
  if (rowEl) {   // la pantalla baja sola siguiendo lo enfocado
    const f = rowEl.querySelectorAll(".li")[c], vh = innerHeight / 100;
    $("rows").style.transform = "translateY(-" + (f ? Math.max(rowEl.offsetTop, f.offsetTop - 14 * vh) : rowEl.offsetTop) + "px)";
  }
  document.querySelectorAll(".bub").forEach((b, i) => b.classList.toggle("f", zone == "menu" && i == mi));
  ["s0", "s1", "s2"].forEach((id, i) => { const e = $(id); if (e) { e.classList.toggle("f", zone == "sheet" && i == si); } });
  const f = document.querySelector(".row.on .tile.f .art") || document.querySelector(".row.on .li.f .lc") || document.querySelector(".row.on .tile .art");
  if (f) { setBg(f.style.backgroundImage); }   // el fondo sigue a lo seleccionado
}

// ---------- Menú, modo y ajustes ----------
function openMenu() { zone = "menu"; mi = sec; document.body.classList.add("menu", "opening"); clearTimeout(openMenu.t); openMenu.t = setTimeout(() => document.body.classList.remove("opening"), 700); }
function closeMenu() { zone = "main"; document.body.classList.remove("menu"); }
function setMode(m) {
  mode = m; sec = T[m].start;
  closeMenu();
  render();
  load();
  document.body.classList.add("modeshow");   // el selector aparece un momento y se quita solo
  clearTimeout(setMode.timer);
  setMode.timer = setTimeout(() => document.body.classList.remove("modeshow"), 2200);
}
function pick(i) {
  const n = T[mode].menu[i];
  if (n == "Settings") { closeMenu(); openSheet(); return; }
  if (n == "Search") { closeMenu(); openKb(); return; }
  sec = i; closeMenu(); render(); load();
}
function openSheet() {
  zone = "sheet"; si = 0;
  $("sheet").innerHTML =
    '<h2>Settings</h2>' +
    '<div class="srow"><span>Start in</span><button class="sbtn" id="s0">' + NAME[start] + '</button></div>' +
    '<div class="srow"><span>Your account</span><button class="sbtn" id="s1">' + (logged ? "Sign out" : "Sign in") + '</button></div>' +
    '<div class="srow" style="justify-content:flex-end"><button class="sbtn danger" id="s2">Quit app</button></div>';
  ["s0", "s1", "s2"].forEach((id, i) => { $(id).onclick = () => { si = i; sheetOk(); }; });
  document.body.classList.add("sheet");
}
function closeSheet() { zone = "main"; document.body.classList.remove("sheet", "kbh"); }
let hintT = 0, kbHints = true, splashDone = false;
const splashT0 = performance.now();
function endSplash(openIt) {   // quita la pantalla de carga y (si todo cargó) abre el menú
  if (splashDone) { return; }
  splashDone = true;
  setTimeout(() => { document.body.classList.remove("splash"); if (openIt && zone == "main") { openMenu(); } }, Math.max(0, 1500 - (performance.now() - splashT0)));
}
setTimeout(() => endSplash(true), 10000);   // por si algo tarda de más
function toggleHints() {   // como Controllify: sale todo y se esconde solo
  const on = !document.body.classList.contains("hints");
  document.body.classList.toggle("hints", on);
  clearTimeout(hintT);
  if (on) { hintT = setTimeout(() => document.body.classList.remove("hints"), 5000); }
}
function sheetOk() {
  if (si == 0) {
    start = start == "music" ? "video" : "music";
    store.set("start", start);
    $("s0").textContent = NAME[start];
    toast("Starts in " + NAME[start]);
  } else if (si == 1) {
    send(logged ? "logout" : "login");
  } else {
    try { window.chrome.webview.postMessage("quit"); } catch (e) { window.close(); }   // C# cierra la ventana
  }
}

// ---------- Control (teclado y gamepad usan lo mismo) ----------
function press(a) {
  if (videoOn) { return; }   // el control es solo del reproductor de video (si no, el A cargaba otro video y la X movía la música)
  if (document.body.classList.contains("splash")) { return; }   // mientras carga no se mueve nada
  if (document.body.classList.contains("vload")) { if (a == "back") { document.body.classList.remove("vload"); sendQ("vclose"); } return; }   // cargando un video
  if (zone == "gate") { if (a == "ok") { sendQ("login"); } return; }
  if (zone == "kb") { return kbPress(a); }   // en el teclado los botones son solo del teclado
  if (a == "menu") { toggleHints(); return; }   // botón Menu: muestra los controles un momento
  if (a == "view") { toggleNow(); return; }
  if (a == "sl" || a == "sr") { sendQ("mc|" + (a == "sl" ? "back" : "fwd")); return; }   // stick derecho: adelantar / atrasar
  if (a == "mtoggle" || a == "mnext" || a == "mprev") { sendQ("mc|" + a.slice(1)); return; }
  if (zone == "now") { if (a == "ok") { sendQ("mc|toggle"); } else if (a == "back") { toggleNow(); } return; }
  if (zone == "sheet") {
    if (a == "up") { si = Math.max(0, si - 1); }
    else if (a == "down") { si = Math.min(2, si + 1); }
    else if (a == "ok") { sheetOk(); }
    else if (a == "back") { closeSheet(); }
    return refresh();
  }
  if (a == "mode") { return setMode(mode == "music" ? "video" : "music"); }
  if (zone == "menu") {
    if (a == "up") { mi = Math.max(0, mi - 1); }
    else if (a == "down") { mi = Math.min(T[mode].menu.length - 1, mi + 1); }
    else if (a == "ok") { pick(mi); }
    else if (a == "back" || a == "right") { closeMenu(); }
    return refresh();
  }
  const rows = T[mode].rows, row = rows[r][1], lst = isList(rows[r]), n = row.length;
  const land = (nr, up) => { r = nr; const nl = isList(rows[r]), len = rows[r][1].length; c = nl ? (up ? len - 1 : 0) : Math.min(c, len - 1); };
  if (a == "left") { if (lst || c == 0) { openMenu(); } else { c--; } }
  else if (a == "right") { if (!lst) { c = Math.min(n - 1, c + 1); } }
  else if (a == "up") { if (lst && c > 0) { c--; } else if (r > 0) { land(r - 1, true); } }
  else if (a == "down") { if (lst && c < n - 1) { c++; } else if (r < rows.length - 1) { land(r + 1, false); } }
  else if (a == "ok") { const it = row[c]; if (typeof it == "string") { toast("Still loading…"); } else if (it.id) { play(it); } else if (it.bid) { drill(it); } }
  else if (a == "back") { if (stack.length) { undrill(); return; } openMenu(); }
  refresh();
}

const KEYS = { ArrowLeft: "left", ArrowRight: "right", ArrowUp: "up", ArrowDown: "down", Enter: "ok", Escape: "back", Backspace: "back", m: "mode", y: "mode", v: "view", "[": "sl", "]": "sr", " ": "mtoggle", n: "mnext", p: "mprev", h: "menu" };
document.addEventListener("keydown", e => {
  if (zone == "kb" && e.key.length == 1) { e.preventDefault(); kq += e.key; return drawKb(); }   // también puedes escribir con el teclado
  if (zone == "kb" && e.key == "Enter") { e.preventDefault(); if (kq.trim()) { kbGo(); } return; }
  if (zone == "kb" && e.key == "Backspace") { e.preventDefault(); kq = kq.slice(0, -1); return drawKb(); }
  if (KEYS[e.key]) { e.preventDefault(); press(KEYS[e.key]); } });

const DIRS = ["left", "right", "up", "down", "sl", "sr"];
let held = {}, padBlock = false, videoOn = false;   // videoOn: hay un video a pantalla completa; esta pantalla no debe reaccionar a nada
addEventListener("focus", () => { padBlock = true; });
function pad() {
  const g = [...(navigator.getGamepads ? navigator.getGamepads() : [])].find(x => x);
  if (g) {
    const b = i => g.buttons[i] && g.buttons[i].pressed;
    const now = {
      left: b(14) || g.axes[0] < -.6, right: b(15) || g.axes[0] > .6,
      up: b(12) || g.axes[1] < -.6, down: b(13) || g.axes[1] > .6,
      ok: b(0), back: b(1), mode: b(3), mtoggle: b(2), mprev: b(4), mnext: b(5), view: b(8), menu: b(9), sl: g.axes[2] < -.6, sr: g.axes[2] > .6
    };
    if (padBlock) { if (Object.values(now).some(Boolean)) { requestAnimationFrame(pad); return; } padBlock = false; held = {}; }   // espera a soltar los botones
    const t = performance.now();
    for (const k in now) {
      if (!now[k]) { held[k] = 0; }
      else if (!held[k]) { press(k); held[k] = t + 300; }                          // primera pulsación
      else if ((DIRS.includes(k) || (zone == "kb" && k == "mtoggle")) && t > held[k]) { press(k); held[k] = t + 150; }   // repetir si mantienes la dirección
    }
  }
  requestAnimationFrame(pad);
}

// ---------- Datos reales y reproductor ----------
// A qué pantalla de YouTube corresponde cada opción del menú
const BROWSE = {
  music: { "Home": "FEmusic_home;FEmusic_charts", "New releases": "FEmusic_new_releases_albums;Music videos=FEmusic_new_releases_videos", "Charts": "FEmusic_charts", "Library": "Playlists=FEmusic_liked_playlists;Albums=FEmusic_liked_albums;Artists=FEmusic_library_corpus_artists;Songs=FEmusic_liked_videos;Podcasts=FEmusic_library_non_music_audio_list", "History": "FEmusic_history" },
  video: { "Home": "Recommended=FEwhat_to_watch#c", "Subscriptions": "Creators=FEchannels#m;FEsubscriptions#du", "Playlists": "FEplaylist_aggregation", "Liked videos": "VLLL", "Watch later": "VLWL", "History": "FEhistory" }
};
const cache = {}; let shownKey = "";
let curQ = "", ki = 0, kq = "", stack = [], dImg = "", dTitle = "", dSub = "", lastM = null;
const sendQ = m => { try { window.chrome.webview.postMessage(m); } catch (e) { } };
function load() {
  const name = T[mode].menu[sec], id = (BROWSE[mode] || {})[name];
  if (!id || !logged) { return; }
  stack = [];
  cur = mode + "|" + id; curQ = "";
  const hit = cache[cur];   // si ya la vimos, se muestra al instante y se actualiza por detrás
  T[mode].rows = hit || [["Loading…", ["…", "…", "…", "…", "…"]]];
  shownKey = hit ? cur : "";
  render();
  $("hs").textContent = hit ? NAME[mode] : "Loading…";
  sendQ("browse|" + mode + "|" + id + "|" + name);
}
function onData(d) {
  if (d.key != cur) { return; }
  if (d.error || !d.rows.length) { endSplash(true); toast(logged ? "Nothing found" : "Sign in from Settings to see your stuff"); return; }
  const CAR_ROWS = ["Quick picks"], LIST_ROWS = ["Music videos"];   // CAR_ROWS: se ven como carrusel aunque YouTube las mande como lista   // filas que se ven como lista de canciones
  const newRows = d.rows.map(x => [x[0], x[1].map(i => ({ id: i.id, bid: i.bid, k: LIST_ROWS.includes(x[0]) ? "l" : CAR_ROWS.includes(x[0]) ? "c" : i.k, t: i.t, s: i.s, bg: "url('" + (i.img || (stack.length ? dImg : "")).replace(/=w\d+-h\d+[^'"()\s]*/, "=w544-h544-l90-rj").replace(/=s\d+-c[^'"()\s]*/, "=s400-c-k-c0x00ffffff-no-rj").replace(/['"()\s]/g, "") + "')" }))]);
  if (mode == "music" && !stack.length && !curQ) { const qi = newRows.findIndex(x => x[0] == "Quick picks"); if (qi > 0) { newRows.unshift(newRows.splice(qi, 1)[0]); } }   // Quick picks siempre arriba
  const plain = !stack.length && !curQ, same = plain && shownKey == d.key, pr = r, pc = c;
  if (same && JSON.stringify(cache[d.key]) == JSON.stringify(newRows)) { endSplash(true); return; }   // nada cambió
  T[mode].rows = newRows;
  if (plain) { cache[d.key] = newRows; shownKey = d.key; }
  render(); endSplash(true);
  if (same) { r = Math.min(pr, newRows.length - 1); c = Math.min(pc, newRows[r][1].length - 1); refresh(); }   // no te mueve de lugar
  $("hs").textContent = curQ ? "Results for “" + curQ + "”" : NAME[mode];
  if (curQ) { $("ht").textContent = "Search"; } else if (stack.length) { $("ht").textContent = dTitle; if (dSub) { $("hs").textContent = dSub; } }
}
function drill(it) {   // abre un álbum, playlist o artista
  stack.push({ rows: T[mode].rows, r, c, ht: $("ht").textContent, hs: $("hs").textContent, img: dImg });
  dImg = (it.bg || "").replace(/^url\('|'\)$/g, ""); dTitle = it.t; dSub = it.s || "";
  const isCh = mode == "video" && /^UC[\w-]{22}$/.test(it.bid), id = isCh ? it.bid + "#vd" : it.bid;   // canal: sus videos, por fecha
  cur = mode + "|" + id; curQ = "";
  $("hs").textContent = "Loading…";
  sendQ("browse|" + mode + "|" + id + "|" + it.t.replace(/\|/g, ""));
}
function undrill() {
  const s = stack.pop();
  T[mode].rows = s.rows; cur = ""; dImg = s.img;
  render(); r = s.r; c = s.c;
  $("ht").textContent = s.ht; $("hs").textContent = s.hs;
  refresh();
}
function play(o) {
  if (mode == "music") { sendQ("mplay|" + o.id); toast("Playing " + o.t); } else { document.body.classList.add("vload"); sendQ("vplay|" + o.id); }
}
function onMusic(m) {   // la canción suena en segundo plano; aquí solo mostramos la barrita y la pantalla completa
  if (!m.t && !m.ad) { return; }
  lastM = m;
  const big = (m.img || "").replace(/=w\d+-h\d+[^'"]*/, "=w1000-h1000").replace(/['"()\s]/g, "");
  const tm = x => Math.floor(x / 60) + ":" + String(Math.floor(x % 60)).padStart(2, "0");
  const pct = (m.dur ? Math.min(100, m.pos / m.dur * 100) : 0) + "%";
  const ttl = m.ad ? "Advertisement" : m.t, sub = m.ad ? (m.sk ? "Press X to skip ad" : "Ad playing…") : m.a;
  $("np").classList.add("on"); document.body.classList.add("hasnp");   // el contenido baja para dejarle lugar arriba
  $("npt").textContent = (m.p ? "▶ " : "❚❚ ") + ttl; $("npa").textContent = sub;
  $("npc").style.backgroundImage = "url('" + big + "')";
  $("npb").firstChild.style.width = pct;
  $("nptm").textContent = tm(m.pos) + " / " + tm(m.dur);
}
function toggleNow() {   // botón View: el now playing se hace grande (sin tapar toda la pantalla)
  if (zone == "now") { zone = "main"; document.body.classList.remove("now"); }
  else if (zone == "main" && $("np").classList.contains("on")) { zone = "now"; document.body.classList.add("now"); }
}

// Teclado en pantalla
const KB0 = "abcdefghijklmnopqrstuvwxyz0123456789".split("").concat(["SPACE", "DEL"]);
const kbKeys = () => kq.trim() ? KB0.concat(["GO"]) : KB0;   // Go solo existe cuando hay texto
function openKb() { zone = "kb"; ki = 0; kq = ""; drawKb(); document.body.classList.add("sheet"); document.body.classList.toggle("kbh", kbHints); document.body.classList.remove("hints"); }
// Atajos del teclado (independientes del resto de la app): X borrar, Y espacio, Menu = Go, B cerrar, View esconde los atajos
function kbPress(a) {
  if (a == "view") { kbHints = !kbHints; document.body.classList.toggle("kbh", kbHints); return; }
  if (a == "left") { ki = Math.max(0, ki - 1); } else if (a == "right") { ki = Math.min(kbKeys().length - 1, ki + 1); }
  else if (a == "up") { ki = Math.max(0, ki - 8); } else if (a == "down") { ki = Math.min(kbKeys().length - 1, ki + 8); }
  else if (a == "mtoggle") { kq = kq.slice(0, -1); }
  else if (a == "mode") { kq += " "; }
  else if (a == "menu") { if (kq.trim()) { kbGo(); } return; }
  else if (a == "ok") { return kbOk(); }
  else if (a == "back") { closeSheet(); return; }
  else { return; }
  drawKb();
}
function drawKb() {
  ki = Math.min(ki, kbKeys().length - 1);
  $("sheet").innerHTML = '<h2>Search ' + (mode == "music" ? "songs" : "videos") + '</h2><div class="kq">' + (esc(kq) || "&nbsp;") + '</div><div class="kg">' +
    kbKeys().map((k, i) => '<button class="sbtn kbk' + (k == "GO" ? " go" : "") + (i == ki ? " f" : "") + '" data-i="' + i + '">' + (k == "SPACE" ? "␣" : k == "DEL" ? "⌫" : k == "GO" ? "Go" : k) + '</button>').join("") + '</div>';
  document.querySelectorAll(".kbk").forEach(b => b.onclick = () => { ki = +b.dataset.i; kbOk(); });
}
function kbOk() {
  const k = kbKeys()[ki];
  if (k == "SPACE") { kq += " "; } else if (k == "DEL") { kq = kq.slice(0, -1); }
  else if (k == "GO") { return kbGo(); } else { kq += k; }
  drawKb();
}
function kbGo() {
  const q = kq.trim().replace(/\|/g, "");
  if (!q) { return; }
  closeSheet(); stack = []; curQ = q; cur = mode + "|" + q;
  $("hs").textContent = "Searching…";
  sendQ("search|" + mode + "|" + q);
}

// ---------- Cuenta (habla con la app de Windows) ----------
function gateUpdate() {   // sin sesión no se puede usar nada: pantalla de inicio de sesión
  const g = !logged && ready;
  document.body.classList.toggle("gate", g);
  if (g) { endSplash(false); document.body.classList.remove("sheet", "menu", "now", "kbh"); zone = "gate"; }
  else if (zone == "gate") { zone = "main"; }
}
$("gbtn").onclick = () => sendQ("login");
let logged = false, ready = false;   // ¿hay sesión iniciada?
function send(m) {
  try { window.chrome.webview.postMessage(m); }
  catch (e) { toast("This only works inside the app"); }
}
try {
  window.chrome.webview.addEventListener("message", e => {
    if (e.data == "video:ready" || e.data == "video:closed") { videoOn = e.data == "video:ready"; document.body.classList.remove("vload"); padBlock = true; held = {}; return; }
    if (typeof e.data == "string" && e.data.startsWith("music:")) { return onMusic(JSON.parse(e.data.slice(6))); }
    if (typeof e.data == "string" && e.data.startsWith("data:")) { return onData(JSON.parse(e.data.slice(5))); }
    if (e.data == "login:ok") { const was = logged, rd = ready; logged = true; ready = true; gateUpdate(); if (!was) { if (rd) { toast("Account connected"); } load(); } }
    else if (e.data == "login:no") { logged = false; ready = true; gateUpdate(); }
    const b = $("s1");
    if (b) { b.textContent = logged ? "Sign out" : "Sign in"; }
  });
} catch (e) { }

render();
load();
pad();
try { window.chrome.webview.postMessage("status"); } catch (e) { }   // pregunta si ya había sesión
</script>
